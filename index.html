<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Momentum — VAROS</title>
<link rel="stylesheet" href="assets/instrument-sans.css">
<style>
  :root{
    /* Fundo */
    --bg:#000000; --panel:#131313; --panel2:#1c1c1c; --panel3:#242424;
    --border:#2b2b2b;
    /* Texto (guia VAROS) */
    --txt:#E2E5EB;    /* títulos, legenda, valores */
    --axis:#C6CAD2;   /* eixos / rótulos de coluna */
    --muted:#878D96;  /* secundário */
    /* Paleta verde-turquesa */
    --accent:#12D8B2; --accent-d:#239B84; --teal-dk:#296055;
    --up:#43AF43; --up-bright:#4FE04F;
    --down:#E5484D;               /* queda: fora da paleta de séries, sinal funcional */
    --up-soft:rgba(67,175,67,.15); --down-soft:rgba(229,72,77,.15);
    --hl:rgba(18,216,178,.09);    /* coluna selecionada (turquesa suave) */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px; margin:0 auto; padding:26px 20px 60px}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
  h1{font-size:23px; font-weight:600; margin:0; letter-spacing:.2px; color:var(--txt)}
  h1 .dot{color:var(--accent)}
  h1 .b3{color:var(--muted); font-weight:400}
  .sub{color:var(--muted); font-size:12.5px; margin-top:5px}

  .controls{
    display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .field{display:flex; flex-direction:column; gap:6px}
  /* Sem isto o display:flex acima vence o [hidden] do navegador e o campo
     de intervalo aparece mesmo escondido. */
  .field[hidden]{display:none}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted)}
  select, input[type=search], input[type=date]{
    font-family:inherit; background:var(--panel2); color:var(--txt);
    border:1px solid var(--border); border-radius:9px; padding:9px 11px;
    font-size:13.5px; outline:none; min-width:150px;
    color-scheme:dark;   /* faz o seletor nativo de data nascer escuro */
  }
  select:focus, input:focus{border-color:var(--accent)}
  select:hover, input:hover{border-color:#3a3a3a}
  input[type=date]{min-width:135px}
  .intervalo{display:flex; align-items:center; gap:8px}
  .intervalo span{color:var(--muted); font-size:12.5px}

  .segmented{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:9px; overflow:hidden}
  .segmented button{
    font-family:inherit; background:transparent; color:var(--axis); border:0;
    padding:9px 13px; font-size:13px; cursor:pointer; border-right:1px solid var(--border);
  }
  .segmented button:last-child{border-right:0}
  .segmented button.on{background:var(--accent); color:#08211b; font-weight:600}
  .segmented button.lig{color:var(--accent); font-weight:600}   /* ligado, mas não selecionado */
  .segmented button:hover:not(.on){color:var(--txt); background:var(--panel3)}
  /* Destaque do seletor de Análise (modo) */
  .segmented.modo button.on{background:var(--accent)}

  .toggle{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:9px; overflow:hidden}
  .toggle button{font-family:inherit; background:transparent; color:var(--axis); border:0; padding:9px 15px; font-size:13px; cursor:pointer; white-space:nowrap}
  .toggle button:hover:not(.on){background:var(--panel3)}
  .toggle button.on.alta{background:var(--up-soft); color:var(--up-bright); font-weight:600}
  .toggle button.on.baixa{background:var(--down-soft); color:var(--down); font-weight:600}

  .summary{color:var(--muted); font-size:12.5px; margin:2px 2px 12px}
  .summary b{color:var(--txt); font-weight:600}
  /* Aviso de ativo sem retorno no período (quebra de série / sem histórico) */
  .aviso{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:rgba(229,72,77,.08); border:1px solid rgba(229,72,77,.28);
    color:var(--axis); font-size:12.5px; line-height:1.5;
  }
  .aviso b{color:var(--txt)}

  .tablewrap{border:1px solid var(--border); border-radius:14px; overflow:auto; background:var(--panel)}
  table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
  thead th{
    position:sticky; top:0; background:#181818; color:var(--axis);
    font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600;
    padding:11px 12px; text-align:right; white-space:nowrap; cursor:pointer; user-select:none;
    border-bottom:1px solid var(--border);
  }
  thead th.lft{text-align:left}
  thead th.sel{color:var(--accent); background:var(--hl)}
  thead th.novo{cursor:default}
  thead th .arw{opacity:.6; font-size:9px}
  tbody td{padding:10px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid rgba(43,43,43,.6)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:rgba(255,255,255,.022)}
  td.lft{text-align:left}
  td.sel{background:var(--hl)}
  .rank{color:var(--muted); width:34px}
  .tk{font-weight:700; letter-spacing:.3px; color:var(--txt)}
  .nm{color:var(--muted); font-size:12px}
  .price{color:var(--txt)}
  .up{color:var(--up-bright)} .down{color:var(--down)} .na{color:#4d5158}
  .quebra{color:var(--down); cursor:help; font-weight:700}   /* célula anulada por quebra de série */
  td[title]{cursor:help}
  .cellbar{position:relative}
  .cellbar .bar{position:absolute; top:0; bottom:0; right:0; opacity:.20}
  .cellbar .val{position:relative}
  td.sel .val{font-weight:700; font-size:14.5px}
  .spark{display:block}
  /* Volume relativo (turquesa — separado do verde/vermelho de retorno) */
  .volcell{position:relative}
  .volcell .vbar{position:absolute; top:0; bottom:0; right:0; background:var(--accent); opacity:.16}
  .volcell .vval{position:relative}
  .vhi{color:var(--accent); font-weight:700}
  .vmid{color:var(--txt)}
  .vlo{color:var(--muted)}

  .empty{padding:40px; text-align:center; color:var(--muted)}
  footer{margin-top:22px; color:var(--muted); font-size:11.5px; line-height:1.6}
  .badge{display:inline-block; padding:3px 10px; border:1px solid var(--border); border-radius:20px; font-size:11px; color:var(--axis); background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Monitor de Momentum<span class="dot"> ·</span> <span class="b3">B3</span></h1>
      <div class="sub" id="sub">carregando…</div>
    </div>
    <div><span class="badge" id="badge">—</span></div>
  </header>

  <div class="controls">
    <div class="field">
      <label>Análise</label>
      <div class="segmented modo" id="segModo">
        <button data-modo="momentum" class="on">Momentum</button>
        <button data-modo="volume">Volume</button>
      </div>
    </div>
    <div class="field">
      <label>Índice</label>
      <select id="selIndice"></select>
    </div>
    <div class="field">
      <label>Período</label>
      <div class="segmented" id="segPeriodo"></div>
    </div>
    <div class="field" id="fieldIntervalo" hidden>
      <label>Intervalo de datas</label>
      <div class="intervalo">
        <input type="date" id="dataDe"><span>até</span><input type="date" id="dataAte">
      </div>
    </div>
    <div class="field">
      <label>Ordenar por</label>
      <div class="toggle" id="segDir">
        <button data-dir="desc" class="on alta">▲ Maiores altas</button>
        <button data-dir="asc" class="baixa">▼ Maiores baixas</button>
      </div>
    </div>
    <div class="field">
      <label>Mostrar</label>
      <select id="selTopN">
        <option value="10">Top 10</option>
        <option value="20" selected>Top 20</option>
        <option value="50">Top 50</option>
        <option value="9999">Todas</option>
      </select>
    </div>
    <div class="field" style="flex:1; min-width:180px">
      <label>Buscar</label>
      <input type="search" id="busca" placeholder="ticker ou empresa — separe por vírgula: VAMO3, KLBN11">
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="tablewrap">
    <table id="tab">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer id="footer"></footer>
</div>

<script src="dados.js"></script>
<script>
(function(){
  const D = window.DADOS_MOMENTUM;
  const ORDEM_PERIODOS = ["1d","sem","mes","1m","2m","3m","6m","1a"];
  const PONTOS_SPARK = 130;          // ~6 meses de pregões no mini-gráfico

  // Nada pode tocar em D antes desta guarda, senão a mensagem de arquivo
  // ausente nunca aparece — o script morre antes com um TypeError.
  if(!D){
    document.getElementById("sub").textContent =
      "Não encontrei o arquivo de dados (dados.js). Rode  python3 atualizar.py  primeiro.";
    return;
  }

  const DATAS = D.datas || [];       // eixo de datas comum (ISO, crescente)

  // Cada ativo é um objeto só, guardado em D.ativos; os índices carregam apenas
  // a lista de tickers. Assim uma ação que está em vários índices não repete a
  // série de preços no arquivo — e na tela vira sempre o mesmo objeto.
  const porTicker = D.ativos || {};
  const listaDe = idx => (idx.tickers || []).map(t => porTicker[t]).filter(Boolean);

  // Universo combinado: "Todos" = união dos índices, sem repetir ticker.
  // Índices marcados com "fora_de_todos" (ex.: IFIX, só fundos imobiliários)
  // ficam de fora daqui — só aparecem quando selecionados diretamente.
  const vistos = new Set();
  const acoesTodos = [];
  for(const idx of Object.values(D.indices)){
    if(idx.fora_de_todos) continue;
    for(const a of listaDe(idx)){
      if(vistos.has(a.ticker)) continue;
      vistos.add(a.ticker);
      acoesTodos.push(a);
    }
  }
  const INDICES = { TODOS: { nome:"Todos os índices de ações", acoes: acoesTodos } };
  for(const [cod, idx] of Object.entries(D.indices)){
    INDICES[cod] = { nome: idx.nome, acoes: listaDe(idx) };
  }

  // Estado da tela
  const estado = {
    modo: "momentum",      // "momentum" | "volume"
    indice: "TODOS",
    periodo: "1m",         // um de ORDEM_PERIODOS ou "custom"
    dir: "desc",           // desc = maiores altas / maior volume
    sortCampo: "retorno",  // "retorno" (usa periodo) ou "volume"
    topN: 20,
    busca: "",
    custom: false,         // coluna de intervalo de datas ligada?
    de: null, ate: null,   // datas do intervalo (ISO)
  };

  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  const summaryEl = document.getElementById("summary");

  // --- Cabeçalho / rótulos ---
  document.getElementById("sub").textContent =
    `Atualizado em ${D.atualizado_em} · pregão de referência ${D.data_pregao || "—"}`;
  document.getElementById("badge").textContent = "Yahoo Finance · fechamento ajustado";

  // Seletor de índice
  const selIndice = document.getElementById("selIndice");
  for(const [cod, idx] of Object.entries(INDICES)){
    const o = document.createElement("option");
    o.value = cod;
    o.textContent = `${cod} — ${idx.nome} (${idx.acoes.length})`;
    selIndice.appendChild(o);
  }

  // Botões de período (+ "Personalizado", que liga a coluna de intervalo)
  const segPeriodo = document.getElementById("segPeriodo");
  const fieldIntervalo = document.getElementById("fieldIntervalo");
  const inpDe = document.getElementById("dataDe");
  const inpAte = document.getElementById("dataAte");

  let ultimoPeriodoFixo = estado.periodo;   // para onde voltar ao desligar "Datas…"

  ORDEM_PERIODOS.forEach(p=>{
    const b = document.createElement("button");
    b.dataset.p = p;
    b.textContent = D.periodos[p] || p;
    b.title = descPeriodo(p);
    if(p===estado.periodo) b.classList.add("on");
    b.onclick = ()=>{
      estado.periodo=p; ultimoPeriodoFixo=p;
      if(estado.modo==="momentum") estado.sortCampo="retorno";
      syncSeg(); render();
    };
    segPeriodo.appendChild(b);
  });

  if(DATAS.length>1){
    const bc = document.createElement("button");
    bc.dataset.p = "custom";
    bc.textContent = "Datas…";
    bc.title = "Escolher um intervalo de datas qualquer";
    bc.onclick = ()=>{
      // Interruptor: liga a coluna e a seleciona; clicando de novo com ela já
      // selecionada, desliga e devolve o período que estava antes.
      if(estado.custom && estado.periodo==="custom"){
        estado.custom = false;
        estado.periodo = ultimoPeriodoFixo || "1m";
      } else {
        estado.custom = true;
        estado.periodo = "custom";
        if(estado.modo==="momentum") estado.sortCampo="retorno";
      }
      fieldIntervalo.hidden = !estado.custom;
      syncSeg(); render();
    };
    segPeriodo.appendChild(bc);

    // Limites e valores iniciais: do primeiro ao último pregão disponível.
    estado.ate = DATAS[DATAS.length-1];
    estado.de  = DATAS.find(d => d >= recuarUmMes(estado.ate)) || DATAS[0];
    [inpDe, inpAte].forEach(el=>{ el.min = DATAS[0]; el.max = DATAS[DATAS.length-1]; });
    inpDe.value = estado.de;  inpAte.value = estado.ate;

    // Lê o intervalo já corrigido, ou null se ainda não dá para usar.
    function lerIntervalo(){
      const pri = DATAS[0], ult = DATAS[DATAS.length-1];
      let de = inpDe.value, ate = inpAte.value;
      // Um input[type=date] fica com value "" enquanto um segmento (dia/mês/ano)
      // está incompleto, e o navegador dispara "change" nesse meio-tempo. Tratar
      // isso como "sem data" faria a tela pular para o histórico inteiro no meio
      // da digitação — então simplesmente ignoramos o estado transitório.
      if(!de || !ate) return null;
      // Limita as duas pontas ao histórico ANTES de reordenar. Na ordem
      // inversa, duas datas fora do histórico do mesmo lado voltavam invertidas
      // e uma delas continuava fora da janela.
      const limitar = x => x < pri ? pri : (x > ult ? ult : x);
      de = limitar(de); ate = limitar(ate);
      if(de > ate) [de, ate] = [ate, de];
      return {de, ate};
    }
    // Mostra no campo a correção aplicada — mas nunca no campo que está com o
    // foco, porque reescrever ali apaga o que o usuário está digitando.
    function refletir(r){
      if(document.activeElement !== inpDe) inpDe.value = r.de;
      if(document.activeElement !== inpAte) inpAte.value = r.ate;
    }
    const onData = ()=>{
      const r = lerIntervalo();
      if(!r) return;
      refletir(r);
      estado.de = r.de; estado.ate = r.ate;
      if(!estado.custom){ estado.custom = true; fieldIntervalo.hidden = false; }
      estado.periodo = "custom";
      if(estado.modo==="momentum") estado.sortCampo="retorno";
      syncSeg(); render();
    };
    inpDe.onchange = onData;
    inpAte.onchange = onData;
    // Ao sair do campo, aí sim o valor corrigido aparece.
    const aoSair = ()=>{ const r = lerIntervalo(); if(r){ inpDe.value=r.de; inpAte.value=r.ate; } };
    inpDe.onblur = aoSair;
    inpAte.onblur = aoSair;
  }

  // Um mês para trás, sem passar por Date local (que desloca por fuso) e sem o
  // overflow do setMonth — 31/03 vira 28/02, não 03/03.
  function recuarUmMes(iso){
    let [a, m, d] = iso.split("-").map(Number);
    if(--m === 0){ m = 12; a -= 1; }
    const ultimoDoMes = new Date(Date.UTC(a, m, 0)).getUTCDate();
    if(d > ultimoDoMes) d = ultimoDoMes;
    return `${a}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  function syncSeg(){
    [...segPeriodo.children].forEach(b=>{
      b.classList.toggle("on", b.dataset.p===estado.periodo);
      // A coluna de intervalo pode estar ligada sem estar selecionada; nesse
      // caso o botão fica destacado, mas sem o preenchimento de "selecionado".
      if(b.dataset.p==="custom")
        b.classList.toggle("lig", estado.custom && estado.periodo!=="custom");
    });
  }

  // Seletor de Análise (modo)
  const segModo = document.getElementById("segModo");
  segModo.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      estado.modo = b.dataset.modo;
      estado.sortCampo = estado.modo==="volume" ? "volume" : "retorno";
      segModo.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      atualizarLabelsDir();
      render();
    };
  });

  // Toggle direção
  const segDir = document.getElementById("segDir");
  const btnDesc = segDir.querySelector('[data-dir="desc"]');
  const btnAsc  = segDir.querySelector('[data-dir="asc"]');
  segDir.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      estado.dir = b.dataset.dir;
      segDir.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      render();
    };
  });
  function atualizarLabelsDir(){
    // Rótulo do toggle depende do que está sendo ordenado.
    const porVolume = estado.modo==="volume" && estado.sortCampo==="volume";
    btnDesc.textContent = porVolume ? "▲ Maior volume" : "▲ Maiores altas";
    btnAsc.textContent  = porVolume ? "▼ Menor volume" : "▼ Maiores baixas";
  }

  selIndice.onchange = e=>{ estado.indice=e.target.value; render(); };
  document.getElementById("selTopN").onchange = e=>{ estado.topN=+e.target.value; render(); };
  document.getElementById("busca").oninput = e=>{ estado.busca=e.target.value.trim().toLowerCase(); render(); };

  // --- Utilidades ---
  const fmtPct = r => r==null ? "—" : (r*100).toFixed(2).replace(".",",")+"%";
  const fmtPreco = p => p==null ? "—" : "R$ "+p.toFixed(2).replace(".",",");
  const classe = r => r==null ? "na" : (r>=0 ? "up" : "down");
  const fmtRvol = v => v==null ? "—" : v.toFixed(v>=10?0:1).replace(".",",")+"×";
  const classeVol = v => v==null ? "na" : (v>=1.5 ? "vhi" : (v>=1 ? "vmid" : "vlo"));
  function fmtVolRs(v){
    if(v==null) return "—";
    if(v>=1e9) return "R$ "+(v/1e9).toFixed(1).replace(".",",")+" bi";
    if(v>=1e6) return "R$ "+(v/1e6).toFixed(0)+" mi";
    return "R$ "+(v/1e3).toFixed(0)+" mil";
  }

  // --- Intervalo de datas ---
  // Posição do último pregão em data <= iso (busca binária no eixo comum).
  function posPregao(iso){
    let lo=0, hi=DATAS.length-1, res=-1;
    while(lo<=hi){
      const m=(lo+hi)>>1;
      if(DATAS[m]<=iso){ res=m; lo=m+1; } else hi=m-1;
    }
    return res;
  }
  // Posição do fechamento válido mais recente até `pos`, andando para trás
  // enquanto não houver negócio (feriado do papel, ação ainda não listada).
  function idxFechamento(a, pos){
    if(pos<0 || !a.serie || !a.serie.length) return -1;
    for(let i=Math.min(pos, a.serie.length-1); i>=0; i--){
      if(a.serie[i]!=null) return i;
    }
    return -1;
  }
  // Devolve {v} quando dá para calcular, ou {erro} dizendo por que não dá.
  // Nunca devolve um número quando o número seria mentira.
  function calcularCustom(a){
    if(!estado.de || !estado.ate) return {erro:"sem-historico"};
    const i0 = idxFechamento(a, posPregao(estado.de));
    const i1 = idxFechamento(a, posPregao(estado.ate));
    if(i0 < 0 || i1 < 0) return {erro:"sem-historico"};
    const d0 = DATAS[i0], d1 = DATAS[i1];
    // Preços dos dois lados de uma quebra não são comparáveis.
    if((a.quebras||[]).some(q => q > d0 && q <= d1)) return {erro:"quebra"};
    const p0 = a.serie[i0], p1 = a.serie[i1];
    if(!p0) return {erro:"sem-historico"};
    return {v: p1/p0 - 1};
  }
  // Recalcular por ativo a cada ordenação sairia caro; o cache vale por render.
  let cacheCustom = new Map();
  function custom(a){
    let r = cacheCustom.get(a.ticker);
    if(r === undefined){ r = calcularCustom(a); cacheCustom.set(a.ticker, r); }
    return r;
  }
  const brDate = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "—";
  // Rótulo curto da coluna (o cabeçalho é apertado) — a data cheia vai no title.
  function rotuloPeriodo(p){
    if(p!=="custom") return D.periodos[p] || p;
    if(!estado.de || !estado.ate) return "Intervalo";
    return brDate(estado.de).slice(0,5)+" → "+brDate(estado.ate).slice(0,5);
  }
  const rotuloPeriodoLongo = p => p==="custom"
    ? `${brDate(estado.de)} a ${brDate(estado.ate)}`
    : (D.periodos[p] || p);
  // O que o período mede, para o title do botão e da coluna. "Semana",
  // "Mês atual" e "1 mês" são próximos demais para o rótulo se explicar sozinho.
  // Função declarada de propósito: os botões de período são montados antes
  // desta linha e precisam dela já disponível.
  function descPeriodo(p){
    return p==="custom"
      ? `Do fechamento mais próximo de ${brDate(estado.de)} até ${brDate(estado.ate)}`
      : ((D.periodos_desc||{})[p] || D.periodos[p] || p);
  }
  // Colunas de retorno da tabela: as fixas, mais a de intervalo quando ligada.
  const colunas = () => estado.custom ? ORDEM_PERIODOS.concat(["custom"]) : ORDEM_PERIODOS;
  const retornoDe = (a, p) => p==="custom" ? (custom(a).v ?? null) : a.retornos[p];
  // Por que a célula ficou sem valor: "quebra" ou "sem-historico".
  const motivoDe  = (a, p) => p==="custom" ? (custom(a).erro || null)
                                           : ((a.motivos||{})[p] || null);

  const escapar = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                                .replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function textoMotivo(a, motivo){
    if(motivo==="quebra"){
      const qs = (a.quebras||[]).map(brDate).join(" e ");
      return `${a.ticker}: a série tem quebra em ${qs} — grupamento ou desdobramento `
           + `que o Yahoo não ajustou para trás, ou cotação inconsistente. Os preços `
           + `dos dois lados dessa data não são comparáveis, então este período fica `
           + `sem valor em vez de mostrar um número errado.`;
    }
    if(motivo==="sem-historico"){
      const pr = a.primeiro_pregao ? brDate(a.primeiro_pregao) : null;
      return pr ? `${a.ticker}: não tem cotação em toda a janela — o primeiro pregão `
                + `disponível é ${pr}.`
                : `${a.ticker}: sem cotação disponível para este período.`;
    }
    return "";
  }

  // Últimos N fechamentos existentes, para o mini-gráfico. Pontos anteriores à
  // última quebra ficam de fora: misturar as duas escalas no mesmo desenho
  // produziria um gráfico tão enganoso quanto o retorno que anulamos.
  function pontosSpark(a){
    if(a._spark) return a._spark;
    const s = a.serie || [];
    let piso = 0;
    for(const q of (a.quebras||[])){
      const i = posPregao(q);
      if(i >= 0 && i > piso) piso = i;
    }
    const out=[];
    for(let i=s.length-1; i>=piso && out.length<PONTOS_SPARK; i--){
      if(s[i]!=null) out.push(s[i]);
    }
    return (a._spark = out.reverse());
  }

  function sparkline(pts){
    if(!pts || pts.length<2) return "";
    const W=84, H=24, pad=2;
    const min=Math.min(...pts), max=Math.max(...pts), rng=(max-min)||1;
    const step=(W-2*pad)/(pts.length-1);
    const coords = pts.map((v,i)=>[
      (pad+i*step).toFixed(1),
      (H-pad-((v-min)/rng)*(H-2*pad)).toFixed(1)
    ]);
    const d = coords.map(c=>c.join(",")).join(" ");
    const cor = pts[pts.length-1] >= pts[0] ? "var(--up-bright)" : "var(--down)";
    return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
         + `<polyline fill="none" stroke="${cor}" stroke-width="1.5" points="${d}"/></svg>`;
  }

  const celAtivo = a => `<td class="lft"><span class="tk">${a.ticker}</span><br>`
                      + `<span class="nm">${a.nome||""}</span></td>`;

  // Lista de tickers para a mensagem de aviso, sem virar um parágrafo.
  function listar(tks){
    if(tks.length<=4) return tks.join(", ");
    return tks.slice(0,4).join(", ") + ` e mais ${tks.length-4}`;
  }
  // Aviso visível quando algum ativo do universo filtrado ficou sem valor no
  // período — sem isso, a ausência passa por "retorno baixo" e engana.
  function montarAviso(universo, per){
    const sem = [], quebrados = [];
    for(const a of universo){
      if(retornoDe(a, per) != null) continue;
      const m = motivoDe(a, per);
      if(m === "quebra") quebrados.push(a.ticker);
      else if(m === "sem-historico") sem.push(a.ticker);
    }
    if(!sem.length && !quebrados.length) return "";
    const partes = [];
    if(quebrados.length)
      partes.push(`<b>${quebrados.length}</b> com quebra de série (${listar(quebrados)})`);
    if(sem.length)
      partes.push(`<b>${sem.length}</b> sem histórico em toda a janela (${listar(sem)})`);
    return `<div class="aviso">⚠ ${partes.join(" · ")} — ${quebrados.length+sem.length===1?"fica":"ficam"} `
         + `fora do ranking de <b>${rotuloPeriodoLongo(per)}</b>, sem valor calculado. `
         + `Passe o mouse sobre o ⚠ ou o — na linha do ativo para ver o motivo.</div>`;
  }

  // --- Render principal ---
  function render(){
    const idx = INDICES[estado.indice];
    const per = estado.periodo;
    cacheCustom = new Map();   // as datas podem ter mudado desde o último render

    // Filtro de busca: vários termos separados por vírgula ("VAMO3, KLBN11"),
    // basta casar com um deles.
    const termos = estado.busca.split(",").map(s=>s.trim()).filter(Boolean);
    let linhas = idx.acoes.filter(a=>{
      if(!termos.length) return true;
      const tk = a.ticker.toLowerCase(), nm = (a.nome||"").toLowerCase();
      return termos.some(t => tk.includes(t) || nm.includes(t));
    });

    // Valor de ordenação: retorno do período OU volume relativo.
    const valorOrd = a => estado.sortCampo==="volume" ? a.rvol : retornoDe(a, per);
    const dir = estado.dir==="desc" ? -1 : 1;
    linhas.sort((a,b)=>{
      const ra=valorOrd(a), rb=valorOrd(b);
      if(ra==null && rb==null) return 0;
      if(ra==null) return 1;
      if(rb==null) return -1;
      return (ra-rb)*dir;
    });

    const totalComDado = linhas.filter(a=>valorOrd(a)!=null).length;
    // O aviso olha o universo filtrado INTEIRO, não só as linhas visíveis: um
    // ativo sem valor cai para o fim da ordenação e sumiria no corte do Top N,
    // que é justamente quando o usuário mais precisa saber que ele existe.
    const aviso = estado.sortCampo==="volume" ? "" : montarAviso(linhas, per);

    // Com uma lista explícita de ativos (busca com vírgulas), mostra todos os
    // que casaram — cortar em Top 20 esconderia justamente o que foi pedido.
    const limite = termos.length>1 ? linhas.length : estado.topN;
    linhas = linhas.slice(0, limite);

    if(estado.modo==="volume") renderVolume(idx, per, linhas, totalComDado, aviso);
    else renderMomentum(idx, per, linhas, totalComDado, aviso);
  }

  // Célula de retorno. Sem valor, mostra o porquê no lugar de um traço mudo.
  function celRetorno(a, p, extraClasse){
    const r = retornoDe(a, p);
    const m = r==null ? motivoDe(a, p) : null;
    const titulo = m ? ` title="${escapar(textoMotivo(a, m))}"` : "";
    const texto = m==="quebra" ? "⚠" : fmtPct(r);
    const cls = (m==="quebra" ? "quebra" : classe(r)) + (extraClasse ? " "+extraClasse : "");
    return {cls, titulo, texto, r};
  }

  // ---- Modo MOMENTUM (tabela limpa, sem volume) ----
  function renderMomentum(idx, per, linhas, totalComDado, aviso){
    const seta = estado.dir==="desc" ? "▼" : "▲";

    const cols = colunas();
    let th = `<tr>
      <th class="lft rank">#</th>
      <th class="lft">Ativo</th>
      <th class="lft">Tendência 6m</th>
      <th>Preço</th>`;
    cols.forEach(p=>{
      const sel = p===per ? " sel" : "";
      const arw = p===per ? `<span class="arw"> ${seta}</span>` : "";
      th += `<th class="col${sel}" data-p="${p}" title="${escapar(descPeriodo(p))}">`
          + `${rotuloPeriodo(p)}${arw}</th>`;
    });
    th += `</tr>`;
    thead.innerHTML = th;
    thead.querySelectorAll("th.col").forEach(el=>{
      el.onclick = ()=>{ estado.periodo=el.dataset.p; estado.sortCampo="retorno"; syncSeg(); render(); };
    });

    const maxAbs = Math.max(0.0001, ...linhas.map(a=>Math.abs(retornoDe(a, per)??0)));
    if(linhas.length===0){
      tbody.innerHTML = `<tr><td class="empty" colspan="${4+cols.length}">Nada encontrado.</td></tr>`;
    } else {
      tbody.innerHTML = linhas.map((a,i)=>{
        let tds = `<td class="lft rank">${i+1}</td>${celAtivo(a)}`
                + `<td class="lft">${sparkline(pontosSpark(a))}</td>`
                + `<td class="price">${fmtPreco(a.preco)}</td>`;
        cols.forEach(p=>{
          const c = celRetorno(a, p);
          if(p===per){
            const w = c.r==null ? 0 : Math.min(100, Math.abs(c.r)/maxAbs*100);
            const barcor = c.r==null ? "transparent" : (c.r>=0? "var(--up)":"var(--down)");
            tds += `<td class="sel cellbar"${c.titulo}><span class="bar" style="width:${w}%;background:${barcor}"></span>`
                 + `<span class="val ${c.cls}">${c.texto}</span></td>`;
          } else {
            tds += `<td class="${c.cls}"${c.titulo}>${c.texto}</td>`;
          }
        });
        return `<tr>${tds}</tr>`;
      }).join("");
    }

    const rotDir = estado.dir==="desc" ? "maiores altas" : "maiores baixas";
    summaryEl.innerHTML =
      `<b>${idx.nome}</b> · ordenado por <b>${rotuloPeriodoLongo(per)}</b> (${rotDir}) · `
      + `${totalComDado} ativos com histórico · mostrando ${linhas.length}.`
      + aviso;
  }

  // ---- Modo VOLUME (visão dedicada) ----
  function renderVolume(idx, per, linhas, totalComDado, aviso){
    const seta = estado.dir==="desc" ? "▼" : "▲";
    const volSel = estado.sortCampo==="volume";
    const retSel = estado.sortCampo==="retorno";

    thead.innerHTML = `<tr>
      <th class="lft rank">#</th>
      <th class="lft">Ativo</th>
      <th class="lft">Tendência 6m</th>
      <th class="novo">Preço</th>
      <th id="thVol" class="${volSel?"sel":""}" title="Volume dos últimos 5 pregões vs. a média dos ~60 anteriores. 2× = negociando o dobro do normal.">Vol. relativo${volSel?`<span class="arw"> ${seta}</span>`:""}</th>
      <th class="novo" title="Volume financeiro médio dos últimos 5 pregões">Volume (R$/dia)</th>
      <th id="thVar" class="${retSel?"sel":""}" title="${rotuloPeriodoLongo(per)}">Var. ${rotuloPeriodo(per)}${retSel?`<span class="arw"> ${seta}</span>`:""}</th>
    </tr>`;
    document.getElementById("thVol").onclick = ()=>{ estado.sortCampo="volume"; atualizarLabelsDir(); render(); };
    document.getElementById("thVar").onclick = ()=>{ estado.sortCampo="retorno"; atualizarLabelsDir(); render(); };

    if(linhas.length===0){
      tbody.innerHTML = `<tr><td class="empty" colspan="7">Nada encontrado.</td></tr>`;
    } else {
      tbody.innerHTML = linhas.map((a,i)=>{
        const v = a.rvol;
        const w = v==null ? 0 : Math.min(100, v/3*100);   // barra escala até 3×
        const c = celRetorno(a, per, retSel ? "sel" : "");
        return `<tr>
          <td class="lft rank">${i+1}</td>${celAtivo(a)}
          <td class="lft">${sparkline(pontosSpark(a))}</td>
          <td class="price">${fmtPreco(a.preco)}</td>
          <td class="volcell${volSel?" sel":""}"><span class="vbar" style="width:${w}%"></span><span class="vval ${classeVol(v)}">${fmtRvol(v)}</span></td>
          <td class="${a.vol_rs==null?"na":"price"}">${fmtVolRs(a.vol_rs)}</td>
          <td class="${c.cls}"${c.titulo}>${c.texto}</td>
        </tr>`;
      }).join("");
    }

    let ordLabel, rotDir;
    if(volSel){
      ordLabel = "volume relativo";
      rotDir = estado.dir==="desc" ? "maior volume" : "menor volume";
    } else {
      ordLabel = "variação em "+rotuloPeriodoLongo(per);
      rotDir = estado.dir==="desc" ? "maiores altas" : "maiores baixas";
    }
    summaryEl.innerHTML =
      `<b>${idx.nome}</b> · análise de volume · ordenado por <b>${ordLabel}</b> (${rotDir}) · `
      + `${totalComDado} ativos com dado · mostrando ${linhas.length}.`
      + aviso;
  }

  document.getElementById("footer").innerHTML =
    "Retornos calculados sobre o preço de fechamento ajustado (proventos e desdobramentos) do Yahoo Finance. "
    + "\"1 dia\" compara o último pregão com o anterior (na segunda, portanto, com a sexta). "
    + "\"Semana\" e \"Mês atual\" são ancorados no calendário — partem do fechamento da última "
    + "sexta e do último pregão do mês passado —, enquanto \"1 mês\" parte do mesmo dia do mês "
    + "anterior. "
    + "Em \"Datas…\", cada ponta do intervalo usa o fechamento do pregão mais próximo para trás — "
    + "se a data escolhida cair em fim de semana ou feriado, vale o último pregão antes dela. "
    + "Volume relativo = média dos últimos 5 pregões ÷ média dos ~60 pregões anteriores. "
    + "Quando a série tem uma quebra (grupamento ou desdobramento não ajustado pela fonte, "
    + "ou cotação inconsistente), os períodos que atravessam essa data aparecem como \"⚠\" "
    + "em vez de um número — preços dos dois lados da quebra não são comparáveis. "
    + "Ferramenta de acompanhamento — não é recomendação de investimento.";

  render();
})();
</script>
</body>
</html>
